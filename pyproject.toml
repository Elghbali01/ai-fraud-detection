[build-system]
requires = ["setuptools>=65,<82", "wheel>=0.48,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fraud-detection"
version = "0.1.0"
description = "Reproducible data quality and exploratory analytics for fraud detection."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary project; dataset terms remain separate." }
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.12,<2",
  "sqlalchemy>=2.0,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.7,<2",
  "joblib>=1.4,<2",
  "shap==0.51.0",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "nbformat>=5.9,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
]

[project.scripts]
fraud-eda = "fraud_detection.eda:main"
fraud-ml = "fraud_detection.ml.cli:main"
fraud-explain = "fraud_detection.explainability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "real_data: optional integration test requiring the local ULB CSV and provenance.",
  "mission03_real_data: opt-in Mission 03 integration using trusted local artifacts and development partitions only.",
  "mission04_real_artifacts: opt-in API integration using trusted model artifacts and synthetic requests only.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["fraud_detection"]

[tool.coverage.report]
show_missing = true
