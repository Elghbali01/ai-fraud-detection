name: Mission 01 quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tools
        run: |
          python -m pip install -r requirements-mission01.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests and static checks
        shell: pwsh
        run: ./scripts/run-checks.ps1
